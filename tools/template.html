<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Toofan Brawler</title>
<style>
:root{--bg:#0d1218;--panel:rgba(13,18,24,.72);--ink:#eef2f6;--muted:#9aa8b5;--yel:#ffc21a;--blu:#2a6bf0;--edge:rgba(255,255,255,.14)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0d1218}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;min-width:200px;backdrop-filter:blur(6px)}
.title{font-weight:800;letter-spacing:.12em;font-size:13px;margin-bottom:6px}
.title span{font-weight:500;letter-spacing:.02em;color:var(--muted);margin-left:6px;font-size:11px}
.row{display:flex;justify-content:space-between;gap:16px;font-size:11px;line-height:1.55;color:var(--muted)}
.row i{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--yel),#ff6a3d)}
#touch{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:52%;height:62%;pointer-events:auto}
#stickBase{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--edge);background:rgba(255,255,255,.06);left:max(80px,env(safe-area-inset-left));top:78%;opacity:.55}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5)}
#btnWrap{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;pointer-events:auto}
.btn{font:700 12px/1 system-ui,sans-serif;letter-spacing:.1em;color:var(--ink);border:2px solid var(--edge);background:rgba(255,255,255,.1);border-radius:50%;width:84px;height:84px;touch-action:none}
.btn.atk{width:104px;height:104px;background:rgba(255,194,26,.28);border-color:rgba(255,194,26,.7);grid-column:2;grid-row:2}
.btn.blk{background:rgba(42,107,240,.3);border-color:rgba(42,107,240,.8);grid-column:1;grid-row:2;margin-bottom:6px}
.btn.fin{grid-column:1 / span 2;grid-row:1;justify-self:center;width:92px;height:92px;background:rgba(255,106,61,.4);border-color:#ff6a3d}
.btn.fin[hidden]{display:none}
.btn.down{transform:scale(.94);filter:brightness(1.4)}

[hidden]{display:none!important}
#tabs{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:2px;background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
#tabs button{font:600 12px/1 system-ui,sans-serif;letter-spacing:.04em;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
#tabs button[aria-pressed="true"]{background:var(--yel);color:#1a1405}
#tabs button:focus-visible,.st-btn:focus-visible,.st-toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}
#hud{top:max(56px,calc(env(safe-area-inset-top) + 48px))}
#studio{position:fixed;z-index:5;top:max(56px,calc(env(safe-area-inset-top) + 48px));left:max(12px,env(safe-area-inset-left));bottom:12px;width:min(318px,calc(100vw - 24px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(8px);overflow:hidden;touch-action:pan-y}
.st-toggle{display:none;font:700 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:transparent;border:0;padding:12px;text-align:left}
.st-body{overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.st-body section h3{margin:0 0 6px;font:700 10px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.st-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-chip{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:8px;padding:6px 8px;min-width:0}
.st-chip b{display:block;font:700 13px system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-chip span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-btn{font:600 11px/1.1 system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:8px;padding:8px 4px;cursor:pointer}
.st-btn:hover{background:rgba(255,255,255,.14)}
.st-btn[aria-pressed="true"]{background:var(--yel);border-color:var(--yel);color:#1a1405}
.st-btn.wide{width:100%;margin-top:8px}
.st-checks{display:grid;gap:6px}.st-check{font-size:12px;color:var(--ink);display:flex;gap:6px;align-items:center}
.st-group{border:1px solid var(--edge);border-radius:8px;margin-bottom:6px;background:rgba(255,255,255,.03)}
.st-group summary{cursor:pointer;font:600 12px system-ui,sans-serif;padding:8px 10px}
.st-row{display:grid;grid-template-columns:96px 1fr 44px;gap:6px;align-items:center;padding:2px 10px 4px;font-size:11px}
.st-row label{color:var(--muted)}.st-row input[type=range]{width:100%;min-width:0;accent-color:var(--yel)}.st-row output{text-align:right;font-variant-numeric:tabular-nums}
.st-parts{font-size:11px;display:grid;gap:2px}.st-parts div{display:grid;grid-template-columns:1fr 62px 62px;gap:6px;padding:2px 4px;border-radius:4px}
.st-parts div:nth-child(odd){background:rgba(255,255,255,.04)}.st-parts i{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}.st-parts .head{color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:720px){
 #studio{top:auto;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));width:auto;bottom:max(8px,env(safe-area-inset-bottom));max-height:44vh}
 .st-toggle{display:block}.st-chips{grid-template-columns:repeat(4,1fr)}.st-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:520px){.panel{min-width:170px}.row{font-size:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tabs" role="tablist"><button id="tabStudio" aria-pressed="true">Hero studio</button><button id="tabStreet" aria-pressed="false">Street test</button></div>
<div id="hud"></div>
<div id="studio" hidden></div>
<div id="touch"></div>

</script>
</body>
</html>
